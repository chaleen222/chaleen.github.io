h+=mk("",head("Skills","What I can do")+`<div class="sk">${C.skills.map(s=>`<div class="card"><h3>${E(s[0])}</h3><div class="chips">${s[1].map(x=>`<span>${E(x)}</span>`).join("")}</div></div>`).join("")}</div><div class="two" style="margin-top:16px">${C.certs.map(c=>`<div class="card"><div class="tg">Certification</div><h3>${E(c[0])}</h3><p>${E(c[1])}</p></div>`).join("")}</div>`,"skills");
const A=C.approach;
h+=`<section><div class="dark r"><div style="text-align:center"><span class="pill" style="background:transparent;color:#b3c2d8;border-color:#3a5074">My approach</span></div><h2>${E(A.title)}</h2>${A.paras.map(p=>`<p>${E(p)}</p>`).join("")}<div class="steps">${A.steps.map(s=>`<span>${E(s)}</span>`).join("")}</div></div></section>`;
h+=mk("",head("Where I want to contribute","Current interests")+`<div class="grid">${C.interests.map(b=>`<div class="card"><h3>${E(b[0])}</h3><p>${E(b[1])}</p></div>`).join("")}</div>`);
h+=mk("end",`<h2>${E(C.closing.title)}</h2><br>${C.closing.paras.map(p=>`<p>${E(p)}</p>`).join("")}<br>${C.links.map((l,i)=>`<a class="btn ${i?"s":"p"}" href="${E(l[1])}"${i==2?" download":""}>${E(l[0])}</a>`).join("")}`,"contact");
$("#app").innerHTML=h;$("#nm").textContent=C.name.replace(/[\[\]]/g,"");
$("#lk").innerHTML=[["about","About"],["experience","Experience"],["projects","Projects"],["international","International"],["skills","Skills"]].map(a=>`<a class="lk" href="#${a[0]}">${a[1]}</a>`).join("");
$("#ft").textContent="© "+new Date().getFullYear()+" "+C.name;
/* modal */
let last;const md=$("#md");
function open(i,el){const o=M[i];last=el;$("#mb").innerHTML=`<button class="x" aria-label="Close">×</button><div class="tg">${E(o.tag)}</div><h2>${E(o.title)}</h2><p class="s">${E(o.sub)}</p>${o.intro.map(p=>`<p>${E(p)}</p>`).join("")}${(o.imgs&&o.imgs.length)?`<div class="gal">${o.imgs.map(s=>`<img src="${E(s)}" alt="${E(o.title)}" loading="lazy" onerror="this.remove()">`).join("")}</div>`:""}${o.blocks.map(b=>`<h4>${E(b[0])}</h4>${Array.isArray(b[1])?`<ul>${b[1].map(x=>`<li>${E(x)}</li>`).join("")}</ul>`:`<p>${E(b[1])}</p>`}`).join("")}`;
 md.classList.add("on");document.body.style.overflow="hidden";$("#mb .x").focus();$("#mb").parentElement.scrollTop=0}
function close(){md.classList.remove("on");document.body.style.overflow="";last&&last.focus()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b)return open(+b.dataset.m,b);if(e.target===md||e.target.closest(".x"))close()});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&md.classList.contains("on"))close()});
/* theme + reveal */
$("#tl").onclick=()=>{const d=document.documentElement,dk=getComputedStyle(d).getPropertyValue("--bg").trim()=="#0d1526";d.dataset.theme=dk?"light":"dark";$("#tl").textContent=dk?"Dark":"Light"};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.06});
document.querySelectorAll(".r").forEach(x=>io.observe(x));
</script></body></html>
